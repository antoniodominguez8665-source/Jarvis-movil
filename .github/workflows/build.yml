name: Compilar APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o jarvis-movil.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle -p proyecto assembleDebug --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-actual --yes --cleanup-tag || true
          gh release create apk-actual proyecto/app/build/outputs/apk/debug/app-debug.apk --title "JARVIS movil" --notes "APK compilado automaticamente."
