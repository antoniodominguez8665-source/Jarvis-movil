name: Compilar APK v3
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o jarvis-movil-v3.zip -d proyecto3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle -p proyecto3 assembleDebug --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-v3 --yes --cleanup-tag || true
          gh release create apk-v3 proyecto3/app/build/outputs/apk/debug/app-debug.apk --title "JARVIS movil 3.0" --notes "APK version 3 compilado automaticamente."
