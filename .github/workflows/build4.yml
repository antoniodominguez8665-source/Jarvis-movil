name: Compilar APK v4
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o jarvis-movil-v4.zip -d proyecto4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle -p proyecto4 assembleDebug --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-v4 --yes --cleanup-tag || true
          gh release create apk-v4 proyecto4/app/build/outputs/apk/debug/app-debug.apk --title "JARVIS movil 4.0" --notes "APK version 4 compilado automaticamente."
